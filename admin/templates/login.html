<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · HR Bot Админка</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>HR Bot · Админка</h1>
      <p class="sub">Вход только для сотрудников HR-отдела</p>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login">
        <div class="form-row">
          <label for="login">Логин</label>
          <input type="text" id="login" name="login" autocomplete="username" required autofocus>
        </div>
        <div class="form-row">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Войти</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
