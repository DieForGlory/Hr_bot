<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Bot Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Управление заявками</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Telegram ID</th>
                            <th>Тип</th>
                            <th>Текущий статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="requests-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const response = await fetch('/api/requests/');
            const data = await response.json();
            const tbody = document.getElementById('requests-tbody');
            tbody.innerHTML = '';

            data.forEach(req => {
                let badgeClass = 'bg-secondary';
                if (req.status === 'Одобрено') badgeClass = 'bg-success';
                if (req.status === 'Отклонено') badgeClass = 'bg-danger';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${req.id}</td>
                    <td>${req.telegram_id}</td>
                    <td>${req.request_type || 'Анкета'}</td>
                    <td><span class="badge ${badgeClass}">${req.status || 'На рассмотрении'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-success me-1" onclick="updateStatus(${req.id}, 'Одобрено')">Одобрить</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="updateStatus(${req.id}, 'Отклонено')">Отклонить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateStatus(id, newStatus) {
            if(!confirm(`Установить статус: ${newStatus}?`)) return;

            const response = await fetch(`/api/requests/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });

            if (response.ok) {
                loadData();
            } else {
                alert('Ошибка обновления статуса');
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
