<!-- admin/templates/dashboard.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>HR Dashboard</title>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Заявки на рассмотрении</h2>
        <table class="table table-hover bg-white shadow-sm rounded">
            <thead>
                <tr>
                    <th>Сотрудник</th>
                    <th>Тип</th>
                    <th>Даты</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for r in requests %}
                <tr id="req-{{ r.id }}">
                    <td>{{ r.user_id }}</td>
                    <td>{{ r.type }}</td>
                    <td>{{ r.start_date }}</td>
                    <td><span class="badge bg-info">{{ r.status }}</span></td>
                    <td>
                        <button onclick="updateStatus({{ r.id }}, 'hr_approved')" class="btn btn-sm btn-success">✅</button>
                        <button onclick="updateStatus({{ r.id }}, 'rejected')" class="btn btn-sm btn-danger">❌</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        async function updateStatus(reqId, status) {
            const response = await fetch(`/api/requests/${reqId}/status?status=${status}`, { method: 'POST' });
            if (response.ok) {
                location.reload(); // Перезагружаем для актуализации статуса
            } else {
                alert("Ошибка при обновлении");
            }
        }
    </script>
</body>
</html>
