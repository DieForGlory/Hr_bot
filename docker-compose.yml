services:
  bot:
    build: .
    command: python run_bot.py
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    env_file:
      - .env
    restart: unless-stopped

  admin:
    build: .
    command: sh -c "python scripts/init_admin.py && uvicorn run_admin:app --host 0.0.0.0 --port 8000"
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    env_file:
      - .env
    restart: unless-stopped